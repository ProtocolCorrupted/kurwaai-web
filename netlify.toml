[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
  # Give streaming responses (Ollama/Claude) enough headroom before the
  # cold model returns its first token. Netlify free allows up to 60s.
  timeout = 60
